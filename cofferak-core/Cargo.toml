[package]
name = "cofferak-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Core library for cofferak: envelope encryption, vault file format, access control and OS key sealing"
repository.workspace = true
homepage.workspace = true

[dependencies]
rand_core = { version = "0.6", features = ["getrandom"] }
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
zeroize = "1.8.2"
serde = { version = "1", features = ["derive"] }
bincode = "1"
serde_json = "1"
sha2 = "0.10"
hkdf = "0.12"
aws-lc-rs = "1.19.0"
base64 = "0.22"
libc = "0.2"
# Only for the `gcp-kms` feature: an HTTPS client for Google Cloud KMS, on
# the same TLS stack as the daemon (rustls on AWS-LC), trusting the public
# web roots, since that is who signs Google's API certificates.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "rustls-webpki-roots", "json"], optional = true }
rustls = { version = "0.23", default-features = false, features = ["std", "aws_lc_rs"], optional = true }
jsonwebtoken = { version = "12", default-features = false, features = ["aws_lc_rs"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = "3.7.0"

[dev-dependencies]
aes-gcm-siv = "0.11.1"

[features]
# Seal the host key with Google Cloud KMS (ADR 0020). Off by default, so
# a plain build has no HTTP client and makes no network calls.
gcp-kms = ["dep:ureq", "dep:rustls"]
